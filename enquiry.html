<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Enquiry | Paws Rescue</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><nav class="navbar"><div class="logo">🐾 Paws Rescue</div><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="services.html">Adoption</a></li><li><a href="enquiry.html" class="active">Enquiry</a></li><li><a href="contact.html">Contact</a></li></ul></nav></header>
<main class="container">
<h1>Adoption Enquiry</h1>
<form id="enquiryForm">
<label>Name* <input type="text" id="name" required></label>
<label>Email* <input type="email" id="email" required></label>
<label>Pet interested in<select id="pet"><option>Bella - Labrador</option><option>Milo - Cat</option><option>Max - Shepherd</option></select></label>
<label>Message<textarea id="message" rows="4" required></textarea></label>
<button type="submit" class="btn">Submit Enquiry</button>
</form>
</main>
<footer><p>&copy; 2026 Paws Rescue</p></footer>
<script src="js/script.js"></script>
</body>
</html>
