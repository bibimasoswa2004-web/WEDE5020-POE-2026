<main class="container">
<h1>Adoption Enquiry - Roodepoort Paws Rescue</h1>
<p>Want to adopt Bella, Milo or Rocky? Fill this form. Cost: R500 adoption fee includes vaccine & sterilization.</p>

<form id="enquiryForm" action="https://formspree.io/f/xdovqkvd" method="POST">
<label>Full Name* <input type="text" id="enqName" name="name" required minlength="3" placeholder="Bibi Masoswa"></label><br><br>
<label>Email* <input type="email" id="enqEmail" name="email" required placeholder="bibi@gmail.com"></label><br><br>
<label>Phone* (10 digits) <input type="tel" id="enqPhone" name="phone" required pattern="[0-9]{10}" placeholder="0601234567"></label><br><br>
<label>Service* 
<select id="enqService" name="service" required>
<option value="Adopt">Adopt a Pet</option>
<option value="Foster">Foster a Pet</option>
<option value="Volunteer">Volunteer</option>
<option value="Sponsor">Sponsor/Donate</option>
</select>
</label><br><br>
<label>Pet interested in
<select id="pet" name="pet">
<option>Bella - Dog - 2 years</option>
<option>Milo - Cat - 1 year</option>
<option>Rocky - Dog - 3 years</option>
<option>Any available</option>
</select>
</label><br><br>
<label>Message* <textarea id="enqMessage" name="message" rows="4" required minlength="10" placeholder="I want to adopt..."></textarea></label><br><br>
<button type="submit" class="btn">Submit Enquiry</button>
<div id="enqError" style="color:red; margin-top:10px;"></div>
<div id="enqResponse" style="display:none; background:#e8f5e9; padding:15px; margin-top:15px; border:1px solid green;"></div>
</form>
</main>
